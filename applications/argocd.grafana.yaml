apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        valueFiles:
          - $values/values.yaml
    - repoURL: https://github.com/diegofnunesbr/grafana.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/diegofnunesbr/grafana.git
      targetRevision: main
      path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
